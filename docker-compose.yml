services:
  geotagger:
    image: ghcr.io/m42cel/geotagger:latest
    ports: ["8080:8080"]
    environment:
      PHOTO_ROOT: /photos
      # Two workers suit a low-power machine; raise it on a stronger one (SPEC §10.1).
      SCAN_CONCURRENCY: 2
    volumes:
      - /path/to/photos:/photos
      - ./cache:/cache
    restart: unless-stopped
